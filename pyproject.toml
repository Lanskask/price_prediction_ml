[project]
name = "price-prediction-ml"
version = "0.1.0"
description = "Bitcoin price prediction using ML and news sentiment analysis"
authors = [
    {name = "Lanskask",email = "grey.wooden.tractor@gmail.com"},
    {name = "Danila",email = "petrovdanich@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "yfinance>=0.2.0",
    "feedparser>=6.0.0",
    "tqdm>=4.66.0",
    "aiohttp>=3.9.0",
    "karpet>=0.1.0",
    "pyarrow>=16.0.0",
]

[project.optional-dependencies]
kaggle = [
    "kagglehub>=0.2.0",
]

[tool.poetry]
name = "price-prediction-ml"
version = "0.1.0"
description = "Bitcoin price prediction using ML and news sentiment analysis"
authors = [
    "Lanskask <grey.wooden.tractor@gmail.com>",
    "Danila <petrovdanich@gmail.com>",
]
packages = [
    { include = "crypto_webscrapper" }
]

[tool.poetry.scripts]
download-news = "crypto_webscrapper.download_bitcoin_news:combine_and_save_datasets"
scrape-recent = "crypto_webscrapper.scrape_recent_news:scrape_all_sources"
create-dataset = "crypto_webscrapper.create_final_dataset:main"
add-prices = "crypto_webscrapper.add_price_data:main"
verify-dataset = "crypto_webscrapper.verify_dataset:main"
fill-missing-hours = "crypto_webscrapper.fill_missing_hours:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
