[project]
name = "price-prediction-ml"
version = "0.1.0"
description = "Bitcoin price prediction using ML and news sentiment analysis"
authors = [
    {name = "Lanskask",email = "grey.wooden.tractor@gmail.com"},
    {name = "Danila",email = "petrovdanich@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "yfinance>=0.2.0",
    "feedparser>=6.0.0",
    "tqdm>=4.66.0",
    "aiohttp>=3.9.0",
    "karpet>=0.1.0",
]

[project.optional-dependencies]
kaggle = [
    "kagglehub>=0.2.0",
]

[tool.poetry]
name = "price-prediction-ml"
version = "0.1.0"
description = "Bitcoin price prediction using ML and news sentiment analysis"
authors = [
    {name = "Lanskask",email = "grey.wooden.tractor@gmail.com"},
    {name = "Danila",email = "petrovdanich@gmail.com"},
]
packages = [
    { include = "crypto_webscrapper" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
